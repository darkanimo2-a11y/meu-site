<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta 
name="viewport" 
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<title>Vendas | DashTik</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="app">


<aside class="sidebar">


<h1>
<span>Dash</span>Tik
</h1>



<ul>


<li onclick="voltarDashboard()">
📊 Dashboard
</li>


<li onclick="abrirProdutos()">
📦 Produtos
</li>


<li class="active">
💰 Vendas
</li>


</ul>


</aside>





<main>


<header>


<div>

<h2>
Registrar Venda
</h2>


<p>
Controle suas vendas
</p>


</div>



</header>







<div class="box">


<h3>
Nova Venda
</h3>


<br>


<label>
Produto
</label>


<select id="produtoVenda">

</select>


<br><br>


<label>
Quantidade
</label>


<input 
id="quantidadeVenda"
type="number"
value="1">



<br><br>


<button onclick="registrarVenda()">

Finalizar Venda

</button>



</div>








<div class="box">


<h3>
Histórico de vendas
</h3>



<table>


<thead>

<tr>

<th>
Produto
</th>

<th>
Quantidade
</th>

<th>
Valor
</th>

</tr>


</thead>


<tbody id="listaVendas">

</tbody>


</table>


</div>




</main>


</div>







<script src="storage.js"></script>

<script src="script.js"></script>


</body>


</html>
