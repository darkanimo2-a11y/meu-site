<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard de Vendas - Protótipo</title>

  <!-- Favicon (ajuste o caminho se necessário) -->
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-32x32.png">

  <style>
    :root{--bg:#f3f4f6;--card:#fff;--accent:#0ea5a4;--muted:#6b7280;}
    *{box-sizing:border-box;font-family:Inter,system-ui,Arial,sans-serif}
    body{margin:0;background:var(--bg);color:#111}
    .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1)}
    .topbar h1{margin:0;font-size:18px}
    .topbar .brand{display:flex;align-items:center;gap:12px}
    .topbar .brand img{height:48px;display:block}
    .actions{display:flex;gap:8px;align-items:center}
    .actions button{padding:8px 12px;border:0;background:var(--accent);color:#fff;border-radius:6px;cursor:pointer}
    .container{padding:20px;max-width:1100px;margin:0 auto}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
    .card{background:var(--card);padding:14px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .label{font-size:12px;color:var(--muted)}
    .value{font-size:20px;font-weight:700;margin-top:6px}
    @media (max-width:700px) {
      .kpis{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="index.html" aria-label="Home">
        <img src="logo.png" alt="Dash Tik">
      </a>
      <h1>Dashboard de Vendas</h1>
    </div>

    <div class="actions">
      <button id="btnNewSale">Registrar venda</button>
      <button id="btnNewAccount">Nova conta</button>
      <div style="width:1px;background:#e6e6e6;height:28px;margin:0 8px"></div>
      <button id="exportSalesCsv">Exportar Vendas CSV</button>
      <button id="exportMonthsCsv">Exportar Faturamento Mensal CSV</button>
    </div>
  </header>

  <main class="container">
    <section class="kpis">
      <div class="card">
        <div class="label">Faturamento mês</div>
        <div id="kpiRevenue" class="value">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="label">Vendas no mês</div>
        <div id="kpiSales" class="value">0</div>
      </div>
      <div class="card">
        <div class="label">Ticket médio</div>
        <div id="kpiTicket" class="value">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="label">Meta mensal (duplo clique para editar)</div>
      </div>
    </section>

    <!-- Aqui ficavam outros conteúdos originais (gráficos antigos, tabelas etc.) -->
  </main>

  <!-- Scripts originais (se houver) podem ser adicionados abaixo.
       No momento não há Chart.js nem scripts do painel de vendas. -->
</body>
</html>
