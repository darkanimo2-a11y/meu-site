<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Produtos | DashTik</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<aside class="sidebar">

<h1>
<span>Dash</span>Tik
</h1>


<ul>

<li>
📊 Dashboard
</li>

<li class="active">
📦 Produtos
</li>

<li>
💰 Vendas
</li>


</ul>


</aside>




<main>


<header>

<h2>
Produtos
</h2>


<button onclick="abrirFormulario()">

+ Novo Produto

</button>


</header>





<div id="formulario" class="box">


<h3>
Cadastrar Produto
</h3>



<input 
id="nome"
placeholder="Nome do produto">



<input 
id="preco"
placeholder="Preço">



<input 
id="estoque"
placeholder="Estoque">



<button onclick="cadastrar()">

Salvar Produto

</button>



</div>





<div class="box">


<h3>
Lista de Produtos
</h3>


<table>


<thead>

<tr>

<th>
Produto
</th>

<th>
Preço
</th>

<th>
Estoque
</th>

<th>
Ação
</th>


</tr>


</thead>



<tbody id="lista">

</tbody>


</table>



</div>



</main>


</div>



<script src="storage.js"></script>


<script src="script.js"></script>


</body>

</html>
