<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VendaPro Dashboard</title>

<link rel="stylesheet" href="css/style.css?v=4">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<div class="layout">


<aside class="sidebar">

<div class="logo">
🚀 VendaPro
</div>


<nav>

<a class="active">🏠 Dashboard</a>

<a>📱 Contas</a>

<a>💰 Vendas</a>

<a>📊 Relatórios</a>

<a>⚙ Configurações</a>

</nav>


</aside>





<main class="main">



<header class="top">


<div>

<h1>
Dashboard
</h1>


<p>
Visão geral das suas vendas
</p>


</div>



<div class="top-buttons">


<button id="novaConta">
+ Nova conta
</button>


<button id="novaVenda">
+ Nova venda
</button>


</div>



</header>






<section class="cards">


<div class="card">

<span>
Faturamento
</span>

<h2>
R$ 0,00
</h2>

</div>



<div class="card">

<span>
Vendas
</span>

<h2>
0
</h2>

</div>




<div class="card">

<span>
Lucro
</span>

<h2>
R$ 0,00
</h2>

</div>




<div class="card">

<span>
Contas
</span>

<h2>
0
</h2>

</div>



</section>








<section class="panel">


<h3>
Minhas contas
</h3>



<div class="table-scroll">


<table>


<thead>

<tr>

<th>Conta</th>

<th>Seguidores</th>

<th>Progresso</th>

<th>Compra</th>

<th>Venda</th>

<th>Status</th>

<th>Ação</th>

</tr>

</thead>


<tbody id="listaContas">

</tbody>


</table>


</div>


</section>








<section class="grid">


<div class="panel">


<h3>
Faturamento mensal
</h3>


<div class="fake-chart">

<div></div>

<div></div>

<div></div>

<div></div>

<div></div>


</div>


</div>







<div class="panel">


<h3>
Últimas vendas
</h3>



<div class="table-scroll">


<table>


<thead>

<tr>

<th>Conta</th>

<th>Cliente</th>

<th>Valor</th>

<th>Ação</th>

</tr>


</thead>



<tbody id="listaVendas">


</tbody>


</table>


</div>


</div>



</section>



</main>


</div>







<!-- MODAL -->


<div id="modal" class="modal">


<div class="modal-box">


<button id="fecharModal" class="fechar">
×
</button>


<div id="conteudoModal">

</div>


</div>


</div>






<script src="js/app.js?v=4"></script>


</body>


</html>
