<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard de Vendas - Protótipo</title>

  <!-- Favicon (ajuste o caminho se necessário) -->
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-32x32.png">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root{--bg:#f3f4f6;--card:#fff;--accent:#0ea5a4;--muted:#6b7280;}
    *{box-sizing:border-box;font-family:Inter,system-ui,Arial,sans-serif}
    body{margin:0;background:var(--bg);color:#111}
    .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1)}
    .topbar h1{margin:0;font-size:18px}
    .topbar .brand{display:flex;align-items:center;gap:12px}
    .topbar .brand img{height:48px;display:block}
    .actions{display:flex;gap:8px;align-items:center}
    .actions button{padding:8px 12px;border:0;background:var(--accent);color:#fff;border-radius:6px;cursor:pointer}
    .container{padding:20px;max-width:1100px;margin:0 auto}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
    .card{background:var(--card);padding:14px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .label{font-size:12px;color:var(--muted)}
    .value{font-size:20px;font-weight:700;margin-top:6px}
    /* Estilos do painel de transações */
    #transacoes-panel { margin-top:18px; }
    #transacoes-panel .panel-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:8px; }
    #transacoesChart { width:100%; display:block; }
    @media (max-width:700px) {
      .kpis{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="index.html" aria-label="Home">
        <img src="logo.png" alt="Dash Tik">
      </a>
      <h1>Dashboard de Vendas</h1>
    </div>

    <div class="actions">
      <button id="btnNewSale">Registrar venda</button>
      <button id="btnNewAccount">Nova conta</button>
      <div style="width:1px;background:#e6e6e6;height:28px;margin:0 8px"></div>
      <button id="exportSalesCsv">Exportar Vendas CSV</button>
      <button id="exportMonthsCsv">Exportar Faturamento Mensal CSV</button>
    </div>
  </header>

  <main class="container">
    <section class="kpis">
      <div class="card">
        <div class="label">Faturamento mês</div>
        <div id="kpiRevenue" class="value">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="label">Vendas no mês</div>
        <div id="kpiSales" class="value">0</div>
      </div>
      <div class="card">
        <div class="label">Ticket médio</div>
        <div id="kpiTicket" class="value">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="label">Meta mensal (duplo clique para editar)</div>
      </div>
    </section>

    <!-- Painel Transações (restaurado) -->
    <section class="card" id="transacoes-panel" aria-labelledby="transacoes-title">
      <div class="panel-header">
        <div id="transacoes-title" style="font-weight:700">Transações</div>
        <div style="font-size:12px;color:#6b7280">Período recente</div>
      </div>
      <canvas id="transacoesChart" role="img" aria-label="Gráfico de transações por período"></canvas>
    </section>

  </main>

  <!-- Script que monta o gráfico de Transações (versão estável) -->
  <script>
    (function () {
      // Dados de exemplo para o gráfico de transações.
      // Substitua por seus dados reais quando quiser.
      // Aqui usamos um conjunto estável de labels (datas) e valores.
      const labels = [
        '03/09','04/09','05/09','06/09','07/09','08/09','09/09','10/09'
      ];
      const values = [1200, 950, 1400, 1100, 1600, 900, 1300, 1250];

      // Executa quando a página estiver carregada para garantir que o canvas exista
      window.addEventListener('load', function () {
        const canvas = document.getElementById('transacoesChart');
        if (!canvas) return;

        // Define altura fixa para evitar loops de resize
        canvas.style.width = '100%';
        canvas.style.height = '260px';
        canvas.setAttribute('height', '260');

        // Se já existir um gráfico, destrói antes de criar outro
        if (window._transacoesChartInstance) {
          try { window._transacoesChartInstance.destroy(); } catch (e) { /* ignore */ }
          window._transacoesChartInstance = null;
        }

        const ctx = canvas.getContext('2d');

        window._transacoesChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Transações (R$)',
              data: values,
              borderColor: 'rgba(250, 204, 21, 0.95)', // amarelo similar ao original
              backgroundColor: 'rgba(250, 204, 21, 0.15)',
              pointBackgroundColor: 'rgba(250, 204, 21, 1)',
              tension: 0.2,
              fill: true,
              pointRadius: 4,
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 300 },
            scales: {
              x: {
                title: { display: true, text: 'Período' },
                grid: { display: false }
              },
              y: {
                title: { display: true, text: 'R$' },
                beginAtZero: true,
                ticks: {
                  callback: function(value) { return 'R$ ' + value.toLocaleString('pt-BR'); }
                }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(ctx) {
                    return 'R$ ' + Number(ctx.parsed.y).toLocaleString('pt-BR');
                  }
                }
              }
            }
          }
        });

        // Observador de resize para atualizar o gráfico sem recriar
        const container = canvas.parentElement;
        if (container && typeof ResizeObserver !== 'undefined') {
          const ro = new ResizeObserver(() => {
            if (window._transacoesChartInstance) {
              window._transacoesChartInstance.resize();
            }
          });
          ro.observe(container);
        }
      });
    })();
  </script>
</body>
</html>
